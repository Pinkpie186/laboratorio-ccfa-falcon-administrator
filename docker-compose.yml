x-logging: &limited-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  init-storage:
    build: .
    user: root
    command: sh -c "mkdir -p /app/storage/private && chown -R node:node /app/storage/private"
    volumes:
      - private_files:/app/storage/private
    restart: "no"
    logging: *limited-logging

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: falcon_admin
      POSTGRES_USER: falcon_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env privado}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U falcon_app -d falcon_admin"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *limited-logging

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-falcon-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Defina MINIO_ROOT_PASSWORD no .env privado}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    logging: *limited-logging

  api:
    build: .
    command: sh -c "node scripts/migrate.js && node scripts/seed.js && node scripts/generate-cited-questions.js && node scripts/generate-ccfa-bank.js && node src/server.js"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://falcon_app:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env privado}@postgres:5432/falcon_admin
      STORAGE_DRIVER: local
      LOCAL_STORAGE_PATH: /app/storage/private
      DOCS_ROOT: /source-docs
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - private_files:/app/storage/private
      - ../:/source-docs:ro
    depends_on:
      init-storage:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    logging: *limited-logging

  worker:
    build: .
    command: node src/worker.js
    env_file: .env
    environment:
      DATABASE_URL: postgresql://falcon_app:${POSTGRES_PASSWORD:-local-change-me}@postgres:5432/falcon_admin
      STORAGE_DRIVER: local
      LOCAL_STORAGE_PATH: /app/storage/private
      DOCS_ROOT: /source-docs
    volumes:
      - private_files:/app/storage/private
      - ../:/source-docs:ro
    depends_on:
      init-storage:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    logging: *limited-logging

volumes:
  postgres_data:
  minio_data:
  private_files:
